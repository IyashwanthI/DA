[project]
name = "healthcare-kg"
version = "0.1.0"
description = "Healthcare KG: OWL load, error detection, LLM ensemble correction, disease prediction, metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0.0",
    "networkx>=3.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
healthcare-kg = "healthcare_kg.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ui = ["streamlit>=1.28.0"]

[tool.setuptools.packages.find]
where = ["src"]
